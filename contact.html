<h2>VOTRE DEMANDE</h2>
<p>Vous souhaitez passer commande ? Demander un devis ? Obtenir un renseignement ? Je suis à votre écoute !</p>

<form action="https://formspree.io/f/mykblngz" method="POST">

<input type="text" name="prenom" placeholder="Prénom" required>
<input type="text" name="nom" placeholder="Nom" required>

<label><input type="radio" name="type" value="particulier"> Particulier</label>
<label><input type="radio" name="type" value="pro"> Professionnel</label>

<input type="text" name="ville" placeholder="Ville">
<input type="email" name="email" placeholder="Email" required>
<input type="tel" name="tel" placeholder="Téléphone">

<select name="objet">
  <option>Commande gâteau</option>
  <option>Demande de devis évènement</option>
  <option>Autre</option>
</select>

<textarea name="message" placeholder="Descriptif de la demande"></textarea>

<button type="submit">Envoyer</button>

</form>
</section>
