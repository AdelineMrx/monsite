<!DOCTYPE html>
<html lang="fr">
<link rel="stylesheet" href="css/style.css">
<head>
  <meta charset="UTF-8">
  <title>Mon site</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: white;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: black;
      font-weight: 500;
    }

    nav a:hover {
      color: #c69c6d;
    }

    /* CAROUSEL */
    .carousel {
      position: relative;
      height: 400px;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .active {
      display: block;
    }

    .caption {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 20px;
    }

    .caption a {
      display: inline-block;
      margin-top: 10px;
      background: #c69c6d;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
    }

    /* 4 COLONNES */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 40px;
    }

    .box {
      background: #f5f5f5;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">LOGO</div>

    <nav>
      <a href="produits.html">Produits</a>
      <a href="#">Évènements</a>
      <a href="#">À propos</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- CAROUSEL -->
  <div class="carousel">

  <!-- SLIDE 1 -->
  <div class="slide active">
    <img src="images/carousel1.jpg">
    <div class="caption">
      <h2>Nos produits</h2>
      <p>Découvrez nos créations</p>
      <a href="produits.html">Découvrir</a>
    </div>
  </div>

  <!-- SLIDE 2 -->
  <div class="slide">
    <img src="images/carousel2.jpg">
    <div class="caption">
      <h2>Évènements</h2>
      <p>Pour vos moments spéciaux</p>
      <a href="evenements.html">Découvrir</a>
    </div>
  </div>

  <!-- SLIDE 3 -->
  <div class="slide">
    <img src="images/carousel3.jpg">
    <div class="caption">
      <h2>Contact</h2>
      <p>Parlons de votre projet</p>
      <a href="contact.html">Me contacter</a>
    </div>
  </div>

</div>

  <!-- 4 COLONNES -->
  <section class="grid">
    <div class="box">Colonne 1</div>
    <div class="box">Colonne 2</div>
    <div class="box">Colonne 3</div>
    <div class="box">Colonne 4</div>
  </section>



<script src="js/script.js"></script>
</body>
</html>
